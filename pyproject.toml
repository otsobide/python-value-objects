[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pyvalueobjects"
version = "0.28.1"
description = "Immutable, validated value objects for domain-driven design: numbers, text, identifiers, security formats, network, money and time."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Javier Parada", email = "javierparada@pm.me" }]
keywords = ["value-objects", "ddd", "domain-driven-design", "validation", "money", "immutable"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Software Development :: Libraries",
]
dependencies = []

[project.urls]
Homepage = "https://codeberg.org/n1nj4t4nuk1/python-value-objects"     # primary, as the README declares
Mirror = "https://github.com/otsobide/python-value-objects"           # the `origin` remote
Issues = "https://github.com/otsobide/python-value-objects/issues"    # where the 1.0 issues live
Changelog = "https://codeberg.org/n1nj4t4nuk1/python-value-objects/src/branch/main/CHANGELOG.md"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6",
    "hypothesis>=6.100",
    "mypy>=1.13",
    "ruff>=0.8",
    "tzdata>=2024.1; sys_platform == 'win32'",   # zoneinfo data for TimeZone tests on Windows (dev only)
]

# Transitional until the 0.x code is gone: also ships pyvalueobjects._legacy and its subpackages.
[tool.setuptools.packages.find]
include = ["pyvalueobjects*"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config"]
xfail_strict = true
filterwarnings = [
    "error",
    # transitional: the legacy cpe.py regex has invalid escapes (a DeprecationWarning on 3.11, then a
    # SyntaxWarning whose text is reworded from 3.14 on)
    "ignore:invalid escape sequence:DeprecationWarning",
    "ignore:.*invalid escape sequence:SyntaxWarning",
]

[tool.coverage.run]
branch = true
source = ["pyvalueobjects"]
omit = ["pyvalueobjects/_legacy/*"]  # transitional: the 0.x code is deleted family by family

[tool.coverage.report]
fail_under = 100
show_missing = true
skip_covered = true
exclude_also = ["@overload", "if TYPE_CHECKING:"]

[tool.mypy]
strict = true
python_version = "3.11"
files = ["pyvalueobjects", "tests/static"]
# Transitional: the 0.x code is not annotated. `exclude` skips its files, and the override silences
# the modules that pyvalueobjects/__init__.py still imports, because mypy follows imports.
exclude = ['^pyvalueobjects/_legacy/']

[[tool.mypy.overrides]]
module = ["pyvalueobjects._legacy.*"]
ignore_errors = true

[tool.ruff]
target-version = "py311"
line-length = 120
extend-exclude = [  # transitional: the 0.x code and its unittest suites
    "pyvalueobjects/_legacy",
    "tests/dates",
    "tests/lists",
    "tests/numbers",
    "tests/security",
    "tests/strings",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "PT", "C4", "PIE"]
ignore = ["RUF023"]                     # __slots__ order is the constructor's field order: never sort it

[tool.ruff.lint.per-file-ignores]
"pyvalueobjects/__init__.py" = ["F401", "I001"]  # transitional: 0.x re-exports outside __all__, by family
"tests/**" = ["E501", "RUF001", "PT018"] # wide sample tables, intentional confusables (Kelvin sign, Arabic digits)
