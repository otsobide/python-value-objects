[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pyvalueobjects"
version = "0.28.1"
description = "Immutable, validated value objects for domain-driven design: numbers, text, identifiers, security formats, network, money and time."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Javier Parada", email = "javierparada@pm.me" }]
keywords = ["value-objects", "ddd", "domain-driven-design", "validation", "money", "immutable"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Software Development :: Libraries",
    "Typing :: Typed",
]
dependencies = []

[project.urls]
Homepage = "https://codeberg.org/n1nj4t4nuk1/python-value-objects"     # primary, as the README declares
Mirror = "https://github.com/otsobide/python-value-objects"           # the `origin` remote
Issues = "https://github.com/otsobide/python-value-objects/issues"    # where the 1.0 issues live
Changelog = "https://codeberg.org/n1nj4t4nuk1/python-value-objects/src/branch/main/CHANGELOG.md"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6",
    "hypothesis>=6.100",
    "mypy>=1.13",
    "ruff>=0.8",
    "tzdata>=2024.1; sys_platform == 'win32'",   # zoneinfo data for TimeZone tests on Windows (dev only)
]

# Transitional until the 0.x code is gone: the legacy subpackages have no __init__.py,
# so they are found as namespace packages (the default for packages.find in pyproject.toml).
[tool.setuptools.packages.find]
include = ["pyvalueobjects*"]

[tool.setuptools.package-data]
pyvalueobjects = ["py.typed"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]  # transitional: the 0.x unittest modules are named *_test.py
addopts = ["-ra", "--strict-markers", "--strict-config"]
xfail_strict = true
filterwarnings = [
    "error",
    # transitional: the legacy cpe.py regex has invalid escapes (a DeprecationWarning on 3.11, reworded on 3.15)
    "ignore:invalid escape sequence:DeprecationWarning",
    "ignore:.*invalid escape sequence:SyntaxWarning",
]

[tool.coverage.run]
branch = true
source = ["pyvalueobjects"]

[tool.coverage.report]
fail_under = 0  # transitional: 0.x code has no gate; 100 from the first 1.0 core commit on
show_missing = true
skip_covered = true
exclude_also = ["@overload", "if TYPE_CHECKING:"]
# Transitional: the 0.x subpackages have no __init__.py, and without this the modules that nothing imports
# are left out of the report instead of counting as uncovered.
include_namespace_packages = true

[tool.mypy]
strict = true
python_version = "3.11"
files = ["pyvalueobjects"]
# Transitional: the 0.x code is not annotated. `exclude` skips its files, and the override silences
# the modules that pyvalueobjects/__init__.py still imports, because mypy follows imports.
exclude = ['^pyvalueobjects/(abstract|dates|errors|lists|numbers|security|strings)/']

[[tool.mypy.overrides]]
module = [
    "pyvalueobjects.abstract.*",
    "pyvalueobjects.dates.*",
    "pyvalueobjects.errors.*",
    "pyvalueobjects.lists.*",
    "pyvalueobjects.numbers.*",
    "pyvalueobjects.security.*",
    "pyvalueobjects.strings.*",
]
ignore_errors = true

[tool.ruff]
target-version = "py311"
line-length = 120
extend-exclude = [  # transitional: the 0.x code and its unittest suites
    "pyvalueobjects/abstract",
    "pyvalueobjects/dates",
    "pyvalueobjects/errors",
    "pyvalueobjects/lists",
    "pyvalueobjects/numbers",
    "pyvalueobjects/security",
    "pyvalueobjects/strings",
    "tests/dates",
    "tests/lists",
    "tests/numbers",
    "tests/security",
    "tests/strings",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "PT", "C4", "PIE"]
ignore = ["RUF023"]                     # __slots__ order is the constructor's field order: never sort it

[tool.ruff.lint.per-file-ignores]
"pyvalueobjects/__init__.py" = ["F401", "I001"]  # transitional: 0.x re-exports without __all__, in an order that matters
"tests/**" = ["E501", "RUF001", "PT018"] # wide sample tables, intentional confusables (Kelvin sign, Arabic digits)
